[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridstress"
version = "0.1.0"
description = "When Dutch electricity prices go negative or extreme, and what a flexible consumer gains by shifting its consumption."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Davide Bason", email = "davidebason@gmail.com" }]
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    # DuckDB's Python client needs pytz to return a TIMESTAMPTZ as a Python datetime;
    # without it, fetchone() and fetchall() raise on any timestamptz column.
    "pytz>=2024.1",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# Making pictures, and exploring which picture to make. Kept out of dependencies because no module
# under src/ imports any of them: the package fetches, parses, loads and validates without drawing
# anything. Install with `pip install -e ".[figures]"`.
figures = [
    "matplotlib>=3.9",
    "jupyter>=1.1",
    # Strips notebook outputs on commit, so a diff shows code rather than rendered images.
    "nbstripout>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
